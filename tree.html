<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ветки карточками</title>

<style>

body {
    background: #1c1c1c;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 40px;
}

/* контейнер всей истории */
#flow {
    max-width: 900px;
    margin: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

/* блок вопроса */
.step {
    background: #2b2b2b;
    border-radius: 18px;
    padding: 25px;
    border-left: 3px solid #4f8cff;
    animation: fadeIn 0.3s ease;
}

/* вопрос */
.question {
    font-size: 24px;
    margin-bottom: 20px;
}

/* карточки */
.cards {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: stretch;

    gap: 20px;
}

/* карточка выбора */
.card {
    width: 220px;

    background: #353535;
    border: 2px solid transparent;

    border-radius: 16px;

    padding: 20px;

    cursor: pointer;

    transition:
        transform 0.15s,
        border 0.2s,
        background 0.2s;
}

.card:hover {
    transform: translateY(-4px);

    border-color: #4f8cff;

    background: #404040;
}

/* выбранная карточка */
.card.selected {
    border-color: #4f8cff;
    background: #2d4c7c;
}

/* заголовок карточки */
.card-title {
    font-size: 20px;
    margin-bottom: 10px;
}

/* описание */
.card-text {
    color: #cfcfcf;
    font-size: 14px;
    line-height: 1.4;
}

/* анимация появления */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<div id="flow"></div>

<script>

const tree = {
    question: "Что хотите создать?",
    choices: [

        {
            title: "Сайт",
            text: "HTML, CSS, JS",
            next: {
                question: "Какой сайт?",
                choices: [

                    {
                        title: "Лендинг",
                        text: "Одностраничный сайт",
                        next: {
                            question: "Нужна анимация?",
                            choices: [
                                {
                                    title: "Да",
                                    text: "GSAP / CSS animation",
                                    next: {
                                        question: "Балда",
                                        choices: [
                                            {title: "YES!!!", text: "Ага, я Балда"},
                                            {title: "NO!!!", text: "Нет, сам балда!"}
                                        ]
                                    }
                                },
                                {
                                    title: "Нет",
                                    text: "Минималистичный вариант"
                                }
                            ]
                        }
                    },

                    {
                        title: "Магазин",
                        text: "Каталог товаров"
                    }
                ]
            }
        },

        {
            title: "Игра",
            text: "2D или 3D",
            next: {
                question: "Какой жанр?",
                choices: [
                    {
                        title: "2D",
                        text: "Pixel Art"
                    },
                    {
                        title: "3D",
                        text: "Three.js"
                    }
                ]
            }
        }

    ]
};

const flow = document.getElementById("flow");

function createStep(node) {

    const step = document.createElement("div");
    step.className = "step";

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = node.question;

    step.appendChild(question);

    const cards = document.createElement("div");
    cards.className = "cards";

    node.choices.forEach(choice => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-title">${choice.title}</div>
            <div class="card-text">${choice.text}</div>
        `;

        card.onclick = () => {

            /* блокируем повторный выбор */
            if (step.dataset.completed) return;

            step.dataset.completed = true;

            /* подсвечиваем выбранную */
            [...cards.children].forEach(c =>
                c.classList.remove("selected")
            );

            card.classList.add("selected");

            /* отключаем остальные */
            [...cards.children].forEach(c => {
                c.style.pointerEvents = "none";
                c.style.opacity = "0.6";
            });

            card.style.opacity = "1";

            /* добавляем следующий шаг */
            if (choice.next) {
                createStep(choice.next);

                /* автоскролл вниз */
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth"
                });
            }
        };

        cards.appendChild(card);
    });

    step.appendChild(cards);

    flow.appendChild(step);
}

createStep(tree);

</script>

</body>
</html>
