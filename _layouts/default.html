<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <!-- Подключение стиля -->
    <style>
      body {
        background-color: #f5f5f5;
        font-family: Georgia, serif;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
      }

      h1, h2, h3, h4, h5, h6 {
        color: #222;
      }

      .back-home {
        display: inline-block;
        margin-bottom: 20px;
        padding: 8px 14px;
        background-color: #e0e0e0;
        color: #222;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }

      .back-home:hover {
        background-color: #d5d5d5;
      }
    </style>

  </head>
    <body>
      {% if page.url != "/" %}
        <a href="{{ site.baseurl }}/" class="back-home">← На главную</a>
      {% endif %}

      {{ content }}
    </body>
</html>
