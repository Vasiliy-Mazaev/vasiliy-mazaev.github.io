/* контейнер всей истории */
#flow {

    display: flex;

/* блок вопроса */

    box-sizing: border-box;
    background: #2b2b2b;
    border-radius: 18px;
    padding: 25px;

    animation: fadeIn 0.3s ease;

/* вопрос */
.question {
    font-size: 24px;

}

/* карточки */
.cards {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: stretch;

}

/* карточка выбора */
.card {
    width: 220px;

    background: #353535;
    border: 2px solid transparent;

    border-radius: 16px;

    padding: 20px;

    cursor: pointer;

    transition:
        transform 0.15s,
        border 0.2s,
        background 0.2s;
}

.card:hover {
    transform: translateY(-4px);

    border-color: #4f8cff;

    background: #404040;
}

/* выбранная карточка */
.card.selected {
    border-color: #4f8cff;
    background: #2d4c7c;
}

/* заголовок карточки */
.card-title {
    font-size: 20px;
    margin-bottom: 10px;
}

/* описание */
.card-text {
    color: #cfcfcf;
    font-size: 14px;
    line-height: 1.4;
}

/* анимация появления */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.restart-btn {
    margin-top: 25px;

    padding: 14px 24px;

    border: none;
    border-radius: 12px;

    background: #4f8cff;
    color: white;

    font-size: 16px;
    cursor: pointer;

    transition: 0.2s;
}

.restart-btn:hover {

}

const flow = document.getElementById("flow");

function createStep(node) {

    const step = document.createElement("div");
    step.className = "step";

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = node.question;

    step.appendChild(question);

    const cards = document.createElement("div");
    cards.className = "cards";

    node.choices.forEach(choice => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-title">${choice.title}</div>
            <div class="card-text">${choice.text || ""}</div>
        `;

        card.onclick = () => {

            /* блокируем повторный выбор */
            if (step.dataset.completed) return;

            step.dataset.completed = true;

            /* подсвечиваем выбранную */
            [...cards.children].forEach(c =>
                c.classList.remove("selected")
            );

            card.classList.add("selected");

            /* отключаем остальные */
            [...cards.children].forEach(c => {
                c.style.pointerEvents = "none";
                c.style.opacity = "0.6";
            });

            card.style.opacity = "1";

            /* добавляем следующий шаг */
            if (choice.next) {
                createStep(choice.next);

                /* автоскролл вниз */
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth"
                });
            }

            /* добавляем результат */
            if (choice.result) {

                const resultStep = document.createElement("div");
                resultStep.className = "step";

                resultStep.innerHTML = `
                    <div class="question">${choice.result.title}</div>
                    <div class="card-text" style="font-size:18px">
                        ${choice.result.text || ""}
                    </div>

                    <button class="restart-btn">
                        Пройти опрос ещё раз
                    </button>
                `;

                flow.appendChild(resultStep);

                resultStep
                    .querySelector(".restart-btn")
                    .addEventListener("click", () => {
                        location.reload();
                    });

                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth"
                });
            }
        };

        cards.appendChild(card);
    });

    step.appendChild(cards);

    flow.appendChild(step);
}
