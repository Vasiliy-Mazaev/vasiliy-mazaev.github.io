<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>картинка в скважине</title>

<style>

.event-image{

    position:relative;

    width:min(80vw, 500px);

    aspect-ratio: 2 / 3;

    margin:auto;
}

.photo{

    position:absolute;

    left:35.5%;
    top:5.5%;

    width:36.5%;
    height:88.5%;

    object-fit:cover;
    object-position:center;
}

.frame{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;
}

</style>



<div class="event-image">

    <img
        class="photo"
        src="event.jpg"
        alt=""
    >

    <img
        class="frame"
        src="keyhole-frame.png"
        alt=""
    >

</div>






</body>
</html>
